<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초성 톡톡 순우리말 탐험대</title>
    <!-- 둥글고 귀여운 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Jua', 'Malgun Gothic', sans-serif;
            background-color: #f7f9fc;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #555;
            font-size: 1.1rem;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 680px;
            gap: 15px;
        }
        
        /* 초성 선택 버튼 바 (ㄹ, ㅊ, ㅋ, ㅌ 추가) */
        .cho-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .cho-btn {
            background-color: #f1f3f5;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            font-size: 1rem;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Jua', sans-serif;
        }
        .cho-btn:hover, .cho-btn.active {
            background-color: #4dabf7;
            color: white;
            transform: translateY(-2px);
        }

        /* 단어 버튼 목록 영역 (초성별 정확히 5개) */
        .word-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #ffffff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            max-height: 220px;
            overflow-y: auto;
        }
        .word-btn {
            background-color: #f8f9fa;
            border: 2px solid #a5d8ff;
            border-radius: 12px;
            padding: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #1971c2;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-family: 'Jua', sans-serif;
        }
        .word-btn:hover {
            background-color: #74c0fc;
            color: white;
            transform: translateY(-2px);
        }
        .word-btn.active {
            background-color: #ff6b6b !important;
            border-color: #ff6b6b !important;
            color: white !important;
        }

        /* 그림/정보 카드 영역 */
        .card-view {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 4px dashed #ffec99;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            background-color: #fff3bf;
            padding: 10px;
            text-align: center;
            font-size: 1.1rem;
            color: #f08c00;
            font-weight: bold;
        }
        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        /* 그림(아이콘) 스타일 */
        .word-icon {
            font-size: 3.5rem;
            margin-bottom: 5px;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
        
        /* 순우리말 배지 */
        .badge {
            display: inline-block;
            background-color: #40c057;
            color: white;
            font-size: 0.9rem;
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .target-word {
            font-size: 2rem;
            color: #2b8a3e;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .meaning-box {
            font-size: 1.1rem;
            color: #495057;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            width: 100%;
        }
        .example-box {
            font-size: 1rem;
            color: #862e9c;
            background: #f3d9fa;
            padding: 10px 15px;
            border-radius: 10px;
            width: 100%;
            line-height: 1.4;
        }
        .placeholder {
            color: #adb5bd;
            font-size: 1.1rem;
            padding: 35px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌱 초성 톡톡 순우리말 탐험대</h1>

    </header>

            <button class="cho-btn" onclick="filterByCho('ㄴ', this)">ㄴ</button>
            <button class="cho-btn" onclick="filterByCho('ㄷ', this)">ㄷ</button>
            <button class="cho-btn" onclick="filterByCho('ㄹ', this)">ㄹ</button>
            <button class="cho-btn" onclick="filterByCho('ㅁ', this)">ㅁ</button>
            <button class="cho-btn" onclick="filterByCho('ㅂ', this)">ㅂ</button>
            <button class="cho-btn" onclick="filterByCho('ㅅ', this)">ㅅ</button>
            <button class="cho-btn" onclick="filterByCho('ㅇ', this)">ㅇ</button>
            <button class="cho-btn" onclick="filterByCho('ㅈ', this)">ㅈ</button>
            <button class="cho-btn" onclick="filterByCho('ㅊ', this)">ㅊ</button>
            <button class="cho-btn" onclick="filterByCho('ㅋ', this)">ㅋ</button>
            <button class="cho-btn" onclick="filterByCho('ㅌ', this)">ㅌ</button>
            <button class="cho-btn" onclick="filterByCho('ㅍ', this)">ㅍ</button>
            <button class="cho-btn" onclick="filterByCho('ㅎ', this)">ㅎ</button>
        </div>

        <!-- 단어 선택 버튼 목록 -->

        <div class="card-view">
            <div class="card-header">✨ 알록달록 우리말 그림 카드 ✨</div>
            <div class="card-body" id="cardBody">
                <p class="placeholder">👆 초성을 고르고 단어를 클릭해보세요!</p>
            </div>
        </div>
    </div>

            { word: "큰골", cho: "ㅋ", icon: "⛰️", meaning: "골짜기 중에서 가장 크고 깊은 골짜기.", example: "깊은 산속 큰골에서 맑은 물이 흘러내린다." },
            { word: "큰마음", cho: "ㅋ", icon: "💖", meaning: "너그럽고 넓은 마음을 뜻하는 순우리말.", example: "친구의 실수를 넓은 큰마음으로 감싸주었다." },
            { word: "큰돌", cho: "ㅋ", icon: "🪨", meaning: "크고 단단한 바위나 돌.", example: "개울가에 듬직한 큰돌들이 자리 잡고 있다." },
            { word: "큰숨", cho: "ㅋ", icon: "😮‍💨", meaning: "숨을 깊이 내쉬거나 크게 쉬는 숨.", example: "긴장이 풀리면서 깊은 큰숨을 내쉬었다." },

            // --- ㅌ (5개) ---
            { word: "털보", cho: "ㅌ", icon: "🦁", meaning: "털이 많거나 털이 수북한 사람이나 동물.", example: "동화 속 아기곰은 귀여운 털보 같다." },

            // --- ㅍ (5개) ---

            { word: "해오라기", cho: "ㅎ", icon: "🦢", meaning: "백로과의 새 이름.", example: "연못가에서 먹이를 찾고 있는 해오라기를 발견했다." },
            { word: "한결", cho: "ㅎ", icon: "☕", meaning: "앞선 상태보다 훨씬 더 나아진 모양.", example: "따뜻한 차를 마셨더니 목이 한결 편안해졌다." },
            { word: "해찬솔", cho: "ㅎ", icon: "🌳", meaning: "햇빛을 가득 받아 푸르고 씩씩한 소나무.", example: "우리 반 친구들은 모두 해찬솔처럼 밝고 건강하다." }
        ];

        const wordListEl = document.getElementById('wordList');
        const cardBodyEl = document.getElementById('cardBody');

        // 초성별 5개 목록 렌더링
        function renderWordList(cho) {
            wordListEl.innerHTML = '';
            const filtered = pureKoreanData.filter(item => item.cho === cho);
            
            filtered.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.textContent = item.word;

                btn.onclick = () => selectWord(item, btn);
                wordListEl.appendChild(btn);
            });
        }

        // 초성 필터링 기능
        function filterByCho(cho, btnEl) {
            document.querySelectorAll('.cho-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderWordList(cho);
        }

        // 단어 선택 시 카드 내용 변경
        function selectWord(item, clickedBtn) {
            document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');

            cardBodyEl.innerHTML = `
                <div class="badge">🌱 예쁜 순우리말</div>
                <div class="word-icon">${item.icon}</div>
                <div class="target-word">[ ${item.word} ]</div>
                <div class="meaning-box">💡 <strong>뜻:</strong> ${item.meaning}</div>
                <div class="example-box">💬 ${item.example}</div>
            `;
        }

        // 초기 실행 ('ㄱ' 초성 선택 상태)
        window.onload = () => {
            renderWordList('ㄱ');
        };
    </script>
